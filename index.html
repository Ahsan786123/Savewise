<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SaveWise</title>
<style>
:root{--bg:#FAFAF8;--sf:#fff;--tx:#171717;--mu:#6b6b6b;--bd:#E5E5E5;--ac:#246B50;--wn:#8a5a00;--ws:#fbf3e0;--hl:#eef4f0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111211;--sf:#191B19;--tx:#F5F5F4;--mu:#A1A1AA;--bd:#30332F;--ac:#76B89A;--wn:#e0b252;--ws:#2a2412;--hl:#1b2620;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111211;--sf:#191B19;--tx:#F5F5F4;--mu:#A1A1AA;--bd:#30332F;--ac:#76B89A;--wn:#e0b252;--ws:#2a2412;--hl:#1b2620;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Inter,ui-sans-serif,system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}.hd{max-width:980px;margin:auto;padding:12px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:-.02em;margin-right:auto;color:var(--tx);text-decoration:none;font-size:18px}.logo i{color:var(--ac);font-style:normal}
header a.n{color:var(--mu);text-decoration:none;font-size:14px;padding:4px 0;border-bottom:2px solid transparent}header a.n.on{color:var(--tx);border-color:var(--ac)}
main{max-width:980px;margin:auto;padding:28px 20px 60px}h1{font-size:clamp(32px,6vw,52px);line-height:1.08;letter-spacing:-.03em;margin:0 0 14px;font-weight:700}h2{font-size:22px;letter-spacing:-.02em;margin:40px 0 12px}h3{font-size:16px;margin:0 0 6px}
.mu{color:var(--mu)}.sm{font-size:13px}.box{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:18px;margin:12px 0}
.btn{background:var(--ac);color:var(--bg);border:1px solid var(--ac);border-radius:6px;padding:10px 16px;font:600 14px inherit;cursor:pointer;text-decoration:none;display:inline-block}.btn.g{background:transparent;color:var(--tx);border-color:var(--bd)}
.ch{display:inline-block;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:6px;padding:7px 12px;margin:3px 4px 3px 0;cursor:pointer;font:14px inherit}.ch.on{border-color:var(--ac);background:var(--hl);font-weight:600}
input,select,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;max-width:100%}input[type=number]{width:150px}
.big{font-size:clamp(34px,7vw,56px);font-weight:700;letter-spacing:-.03em;line-height:1.1}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.st{font-size:12px;border:1px solid var(--bd);border-radius:4px;padding:1px 6px;color:var(--mu)}.st.p{color:var(--wn);border-color:var(--wn)}.st.v{color:var(--ac);border-color:var(--ac)}
.note{background:var(--ws);color:var(--wn);border-radius:6px;padding:10px 12px;font-size:14px;margin:10px 0}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{color:var(--mu);font-weight:500}
details>summary{cursor:pointer;color:var(--ac);font-weight:600;margin-top:8px}label.f{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}a{color:var(--ac)}
@media(max-width:640px){main{padding:20px 16px 90px}.hd{gap:12px}.stg{position:sticky;top:0}}
button.btn:disabled,button.ch:disabled,input:disabled{opacity:.5;cursor:not-allowed}#aim{max-height:60vh;overflow-y:auto}.btn{font-family:inherit}button.ch{font:14px inherit}
</style></head><body>
<header><div class="hd"><a class="logo" href="#home">Save<i>Wise</i></a><a class="n" href="#find">Find Savings</a><a class="n" href="#cards">Credit Cards</a><a class="n" href="#calc">Calculator</a><a class="n" href="#dash">Dashboard</a><a class="n" href="#advisor">AI Advisor</a><a class="n" href="#settings">Settings</a></div></header>
<main id="app"></main>
<script>
//ENGINE_START
const CATS={groceries:'Groceries (offline)',quick:'Quick commerce',online:'Online shopping',offline:'Offline shopping',fuel:'Fuel',dining:'Dining',delivery:'Food delivery',recharge:'Mobile & broadband',bills:'Electricity & utilities',subs:'Subscriptions',entertainment:'Entertainment',electronics:'Electronics',travel:'Travel & hotels',health:'Healthcare',insurance:'Insurance',education:'Education',rent:'Rent',other:'Other'};
const L1=['offline','groceries','quick','dining','entertainment','electronics','travel','health','other'];
// Dataset v0.1. st: partial = some fields confirmed; unverified = listed, never used in estimates. No record is "verified" (no official card page/MITC was read in full).
const CARDS=[
{id:'sbi-cashback',bank:'SBI Card',name:'Cashback SBI Card',type:'Cashback',st:'partial',join:999,fee:999,waive:200000,inc:20000,rules:[{g:'on',cats:['online','delivery','subs','amazon'],r:5},{g:'off',cats:L1,r:1}],caps:{on:2000,off:2000},tot:4000,capUnknown:false,
 excl:'Reported no rewards on fuel, utilities, insurance, rent, wallet loads, education, government, gaming and toll. Not rewarded here: recharge, bills, fuel, rent, insurance, education.',
 notes:'Sources disagree on the cap (older ₹5,000 combined; ₹4,000 from April 2026). The newer figure is used. GST treatment of the ₹999 fee differs between sources.',ver:'2026-11-24',
 src:[['https://cardadvisor.in/cards/sbi-cashback','CardAdvisor (third-party)'],['https://www.pickmycard.in/cards/sbi-cashback','PickMyCard (third-party)'],['https://sbicard.com/sbi-card-en/assets/docs/pdf/key-fact-statement.pdf','SBI Card key fact statement (general charges only)']]},
{id:'icici-amazon',bank:'ICICI Bank',name:'Amazon Pay ICICI Credit Card',type:'Co-branded / shopping',st:'partial',join:0,fee:0,waive:null,inc:25000,rules:[{g:'am',cats:['amazon'],r:5,rNP:3},{g:'ba',cats:['online','offline','groceries','quick','dining','delivery','entertainment','electronics','travel','subs','health','other'],r:1}],caps:{},tot:null,capUnknown:true,
 excl:'Exclusion list not confirmed; fuel, bills, recharge, rent, insurance and education are treated as no reward. 2% on 100+ Amazon Pay partners not applied (partner list not captured). Rewards are Amazon Pay balance, not statement credit.',
 notes:'Zero joining and annual fee is stated on ICICI’s own site. Reward rates come from third-party pages. Sources conflict on caps, so the estimate may be overstated.',ver:'2026-11-24',
 src:[['https://www.icicibank.com/personal-banking/cards/credit-card/amazon-pay-index','ICICI Bank (fees only)'],['https://cardadvisor.in/cards/icici-amazon-pay','CardAdvisor (third-party)'],['https://www.motilaloswal.com/learning-centre/2026/3/best-credit-cards-in-india-2026-compare-top-options','Motilal Oswal (third-party)']]},
{id:'axis-ace',bank:'Axis Bank',name:'Axis Bank ACE',type:'Cashback',st:'unverified',join:499,fee:499,waive:200000,inc:20000,rules:null,excl:'Reported: 5% on bill payments via Google Pay, 4% on Swiggy/Zomato/Ola, 2% elsewhere. Caps not found.',notes:'Single third-party source (March 2026). Not used in estimates.',ver:'2026-11-24',src:[['https://www.motilaloswal.com/learning-centre/2026/3/best-credit-cards-in-india-2026-compare-top-options','Motilal Oswal (third-party)']]},
{id:'hdfc-millennia',bank:'HDFC Bank',name:'HDFC Millennia',type:'Cashback',st:'unverified',join:null,fee:1000,waive:null,inc:null,rules:null,excl:'Reported: 5% on ten partner brands (list not captured), cap about ₹2,000/month, 1% base.',notes:'Third-party summary only. Not used in estimates.',ver:'2026-11-24',src:[['https://1finance.co.in/blog/sbi-cashback-credit-card-review-2026/','1Finance (third-party)']]}];
const TIPS={fuel:'Check your fuel brand’s own loyalty programme and app. Terms are not yet in the dataset.',dining:'Dining offers vary by restaurant, city and date. Check booking apps for your specific restaurant before assuming a discount.',subs:'Compare annual and monthly plan prices on the provider’s own site, and check whether another service you already pay for bundles it.',recharge:'Compare your operator’s current plans, including multi-month plans, on its official app.',electronics:'Compare bank and retailer offers for the exact product and date. Do not rely on a promised future sale.',groceries:'Discounted gift cards may exist for some retailers. SaveWise has no verified gift-card data yet, so check terms yourself.'};
const rate=(c,cat,pr)=>{for(const r of c.rules||[])if(r.cats.includes(cat))return{g:r.g,r:(pr||!r.rNP)?r.r:r.rNP};return null};
function cardReward(c,items,pr){const g={};items.forEach(i=>{const x=rate(c,i.cat,pr);if(x)g[x.g]=(g[x.g]||0)+i.amt*x.r/100});let t=0;for(const k in g){const cap=c.caps&&c.caps[k];t+=cap!=null?Math.min(g[k],cap):g[k]}return c.tot!=null?Math.min(t,c.tot):t}
function lines(S){const L=[];for(const[c,a]of Object.entries(S.spend)){if(!(a>0)||!isFinite(a))continue;if(c=='online'&&S.amz>0){const z=Math.min(S.amz,a);L.push({cat:'amazon',amt:z});if(a-z>0)L.push({cat:'online',amt:a-z})}else L.push({cat:c,amt:a})}return L}
function portfolio(cs,newIds,L,pr){const m=cs.map(()=>[]);L.forEach(l=>{let bi=-1,br=0;cs.forEach((c,i)=>{const x=rate(c,l.cat,pr);if(x&&x.r>br){br=x.r;bi=i}});if(bi>=0)m[bi].push(l)});
 let mo=0,f1=0,f2=0;const parts=cs.map((c,i)=>{const r=cardReward(c,m[i],pr),used=m[i].reduce((s,l)=>s+l.amt,0),isNew=newIds.includes(c.id);let a=0,b=0;if(isNew){a=c.join||0;b=(c.waive!=null&&used*12>=c.waive)?0:(c.fee||0)}mo+=r;f1+=a;f2+=b;return{c,r,used,items:m[i],isNew,f1:a,f2:b}});
 return{parts,mo,f1,f2,y1:mo*12-f1,y2:mo*12-f2}}
function eligible(S,c){if(c.st=='unverified'||S.age=='u18')return{ok:false,why:'Not recommended'};if(S.interest=='no'||S.payFull=='no')return{ok:false,why:'Not recommended'};if(c.fee>0&&S.feeOk=='no')return{ok:false,why:'Annual fee'};
 if(c.inc&&S.income>0&&S.income<c.inc)return{ok:false,why:'Below published income minimum'};return{ok:true,unk:(c.inc&&!(S.income>0)?'Income requirement ₹'+c.inc.toLocaleString('en-IN')+'/month — unverified for you':'')+(S.age=='18-20'?' Minimum age not confirmed in our sources.':'')}}
function plan(S){const L=lines(S),pr=S.prime=='yes',total=L.reduce((s,l)=>s+l.amt,0),use=CARDS.filter(c=>c.st!='unverified');
 const own=use.filter(c=>(S.owned||[]).includes(c.id)),base=portfolio(own,[],L,pr),maxN=Math.max(0,(S.maxCards||2)-own.length);
 const cand=use.filter(c=>!own.includes(c)&&eligible(S,c).ok);let singles=[],pairs=[];
 if(maxN>=1)singles=cand.map(c=>({set:[c],p:portfolio([...own,c],[c.id],L,pr)})).map(x=>({...x,inc1:x.p.y1-base.y2*0-base.mo*12,inc:x.p.y2-base.y2})).sort((a,b)=>b.inc-a.inc);
 if(maxN>=2)for(let i=0;i<cand.length;i++)for(let j=i+1;j<cand.length;j++){const p=portfolio([...own,cand[i],cand[j]],[cand[i].id,cand[j].id],L,pr);pairs.push({set:[cand[i],cand[j]],p,inc:p.y2-base.y2})}
 pairs.sort((a,b)=>b.inc-a.inc);const bs=singles[0]&&singles[0].inc>0?singles[0]:null;const bp=pairs[0]&&pairs[0].inc>(bs?bs.inc:0)?pairs[0]:null;
 const best=bp||bs;const final=best?best.p:base;
 return{L,total,base,own,singles,bs,bp,best,final,unver:CARDS.filter(c=>c.st=='unverified'),annual:Math.max(0,final.y2)}}
const fm=n=>Number.isFinite(n)?'₹'+Math.round(n).toLocaleString('en-IN'):'—';
//ENGINE_END
const $=s=>document.querySelector(s);
const fresh=()=>({age:'25-34',emp:'',student:'',income:0,fam:'',hasCard:'no',interest:'yes',pay:[],main:'',spend:{},amz:0,prime:'no',fuelBrand:'',owned:[],payFull:'yes',effort:'balanced',maxCards:2,feeOk:'yes',buys:[],step:0});
let S=(()=>{try{const j=JSON.parse(localStorage.getItem('sw2')||'null');if(j&&j.spend)return{...fresh(),...j}}catch(e){}return fresh()})();
const save=()=>{try{localStorage.setItem('sw2',JSON.stringify(S))}catch(e){}};
let theme='system';try{theme=localStorage.getItem('sw2t')||'system'}catch(e){}
const applyTheme=()=>{if(theme=='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',theme)};applyTheme();
const adult=()=>S.age!='u18';
const ch=(on,a,v,t)=>`<span class="ch ${on?'on':''}" role="button" tabindex="0" data-a="${a}" data-v="${v}">${t}</span>`;
const AGES=[['u18','Under 18'],['18-20','18–20'],['21-24','21–24'],['25-34','25–34'],['35-44','35–44'],['45-59','45–59'],['60+','60+']];
const STAGES=['About you','Payments','Cards','Categories','Amounts','Purchases','Preferences','Review'];
const vis=()=>[0,1,...(adult()&&S.hasCard=='yes'?[2]:[]),3,4,5,6,7];
const st=c=>`<span class="st ${c.st=='partial'?'p':'v'}">${c.st=='partial'?'Partially verified':'Unverified'}</span>`;
function screen(i){const y=(k,vals)=>vals.map(v=>ch(S[k]==v[0],'set:'+k,v[0],v[1])).join('');
 if(i==0)return`<h2>About you</h2><label class="f">Age group</label>${AGES.map(a=>ch(S.age==a[0],'age',a[0],a[1])).join('')}${S.age=='u18'?'<div class="note">Under 18: SaveWise will not suggest credit cards. You will see non-card guidance only.</div>':''}<label class="f">Employment</label>${y('emp',[['student','Student'],['salaried','Salaried'],['self','Self-employed / business'],['home','Homemaker'],['other','Other']])}<label class="f">Monthly income (optional) <span class="mu sm">Only used to check published card income minimums.</span></label><input type="number" inputmode="numeric" min="0" data-i="income" value="${S.income||''}" placeholder="₹">${adult()?`<label class="f">Whose expenses are these?</label>${y('fam',[['me','Only mine'],['family','Family']])}<label class="f">Do you have a credit card?</label>${y('hasCard',[['yes','Yes'],['no','No']])}<label class="f">Open to a new card, if eligible?</label>${y('interest',[['yes','Yes'],['no','No, non-card savings only']])}`:''}`;
 if(i==1)return`<h2>How you pay</h2><label class="f">Methods you use</label>${['UPI','Cash','Debit card','Credit card','Wallets','Gift cards','Loyalty points'].filter(p=>adult()||p!='Credit card').map(p=>ch(S.pay.includes(p),'pay',p,p)).join('')}<label class="f">Most used</label>${S.pay.map(p=>ch(S.main==p,'set:main',p,p)).join('')||'<span class="mu">Select methods above</span>'}`;
 if(i==2)return`<h2>Your existing cards</h2><p class="mu">Search the dataset. Never enter card numbers.</p><input type="search" id="cs" placeholder="Search card or bank" data-q="1" style="width:100%;max-width:340px"><div style="margin-top:8px">${CARDS.map(c=>`<span data-t="${(c.name+c.bank).toLowerCase()}">${ch(S.owned.includes(c.id),'own',c.id,c.name)}</span>`).join('')}</div><p class="mu sm">Cards not in the dataset are not optimised yet.</p><label class="f">Do you pay the full statement balance every month?</label>${y('payFull',[['yes','Yes'],['no','No, I sometimes carry a balance']])}${S.payFull=='no'?'<div class="note">Credit-card interest can far exceed rewards. SaveWise will not suggest new cards while you carry a balance.</div>':''}`;
 if(i==3)return`<h2>What do you spend on?</h2><p class="mu">Select all that apply. Count quick commerce only under Quick commerce.</p>${Object.entries(CATS).map(([k,v])=>ch(k in S.spend,'cat',k,v)).join('')}`;
 if(i==4){const ks=Object.keys(S.spend);return`<h2>Monthly amounts</h2>${ks.map(k=>`<label class="f">${CATS[k]}</label><input type="number" inputmode="numeric" min="0" data-i="sp:${k}" value="${S.spend[k]||''}" placeholder="₹ per month">`).join('')||'<p class="note">Choose at least one category first.</p>'}
 ${'online' in S.spend?`<h3 style="margin-top:22px">Online shopping details</h3><label class="f">Of your online spend, how much is on Amazon.in?</label><input type="number" min="0" data-i="amz" value="${S.amz||''}" placeholder="₹"><label class="f">Amazon Prime member?</label>${y('prime',[['yes','Yes'],['no','No']])}`:''}${'fuel' in S.spend?`<h3 style="margin-top:22px">Fuel</h3><label class="f">Brand</label>${['HPCL','IndianOil','BPCL','No preference'].map(b=>ch(S.fuelBrand==b,'set:fuelBrand',b,b)).join('')}`:''}`}
 if(i==5)return`<h2>Planned purchases</h2><p class="mu">One-time purchases are never multiplied by twelve.</p>${S.buys.map((b,j)=>`<div class="box"><input value="${b.n}" placeholder="Item" data-i="bn:${j}"> <input type="number" min="0" value="${b.a||''}" placeholder="₹ budget" data-i="ba:${j}"> ${ch(b.m=='amazon','bm:'+j,'amazon','Amazon.in')}${ch(b.m=='online','bm:'+j,'online','Other online')}${ch(b.m=='offline','bm:'+j,'offline','Offline')} <span class="ch" data-a="bdel" data-v="${j}">Remove</span></div>`).join('')}<span class="btn g" data-a="badd">Add purchase</span>`;
 if(i==6)return`<h2>Preferences</h2><label class="f">Effort you will accept</label>${y('effort',[['simple','Simple'],['balanced','Balanced'],['max','Maximum']])}${adult()?`<label class="f">Most cards you will manage (including ones you own)</label>${[1,2,3].map(n=>ch(S.maxCards==n,'mc',n,n)).join('')}<label class="f">Will you pay an annual fee if net benefit is higher?</label>${y('feeOk',[['yes','Yes'],['no','No, fee-free only']])}`:''}`;
 if(i==7){const P=plan(S);return`<h2>Review</h2>${[['About you',0,`${AGES.find(a=>a[0]==S.age)[1]}, ${S.emp||'employment not set'}`],['Payments',1,S.pay.join(', ')||'none selected'],['Categories & amounts',4,Object.entries(S.spend).map(([k,v])=>CATS[k]+' '+fm(v)).join(' · ')||'none'],['Purchases',5,S.buys.length+' planned'],['Preferences',6,S.effort+(adult()?', up to '+S.maxCards+' cards':'')]].map(r=>`<div class="box row"><div><b>${r[0]}</b><div class="mu sm">${r[2]}</div></div><span class="ch" data-a="goto" data-v="${r[1]}">Edit</span></div>`).join('')}<p>Estimated monthly spend: <b>${fm(P.total)}</b></p>`}}
function quiz(){const v=vis(),pos=Math.max(0,v.indexOf(S.step));if(pos<0)S.step=0;const cur=v[pos];
 return`<div class="stg mu sm">Stage ${pos+1} of ${v.length}: ${STAGES[cur]}</div><div class="bar" style="margin:6px 0 4px"><i style="width:${(pos+1)/v.length*100}%"></i></div>${screen(cur)}<div class="row" style="margin-top:24px"><span class="btn g" data-a="back">Back</span><span class="btn" data-a="next">${pos==v.length-1?'See my savings':'Next'}</span></div><p class="mu sm">Progress is saved in this browser only.</p>`}
function clean(){if(!adult()){S.owned=[];S.hasCard='no';S.interest='no'}if(S.hasCard!='yes')S.owned=[];if(!('online' in S.spend)){S.amz=0;S.prime='no'}if(!('fuel' in S.spend))S.fuelBrand=''}
function dash(){const P=plan(S);if(!P.L.length)return`<h2>No spending yet</h2><p class="mu">Answer the questionnaire to see savings.</p><a class="btn" href="#find">Find my savings</a>`;
 const f=P.final,mx=Math.max(...P.L.map(l=>l.amt)),lab=l=>l.cat=='amazon'?'Amazon.in':CATS[l.cat];
 return`<h1 style="font-size:36px">Your potential annual savings</h1><div class="box"><div class="big">${fm(P.annual)}</div><div class="mu">${fm(P.annual/12)} per month · ${(P.total?P.annual/12/P.total*100:0).toFixed(1)}% of ${fm(P.total)} monthly spend · after fees, subsequent-year basis</div><div class="note">Estimate from partially verified rules. Actual rewards depend on terms at the time of spending. Not a guarantee.</div></div>

function aiBind(){paint();const q=$('#aiq');if(q)q.onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();const v=q.value;q.value='';aiSend('chat',v).then(()=>{})}};if(window.aiAuto){window.aiAuto=false;if(AI.consent)aiSend('plan','Create my personalised savings plan.')}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-ai]');if(!t||t.disabled)return;const a=t.dataset.ai;
 if(a=='go'){window.aiAuto=true;if(location.hash=='#advisor')render();else location.hash='advisor'}
 else if(a=='consent'){if(!$('#aic')||!$('#aic').checked){AI.err='Please tick the box to agree first.';const x=$('#aie');if(x)x.innerHTML=`<div class="note" role="alert">${AI.err}</div>`;return}AI.consent=true;try{localStorage.setItem('sw2ai','1')}catch(x){}AI.err='';render()}
 else if(a=='revoke'){AI.consent=false;AI.msgs=[];try{localStorage.removeItem('sw2ai')}catch(x){}render()}
 else if(a=='plan')aiSend('plan','Create my personalised savings plan.');
 else if(a=='ask')aiSend('chat',t.dataset.q);
 else if(a=='send'){const q=$('#aiq');const v=q.value;q.value='';aiSend('chat',v)}
 else if(a=='clear'){AI.msgs=[];AI.err='';paint()}});
addEventListener('hashchange',render);render();
</script></body></html>
